<VirtualHost *:80>
    ServerName uts-laela.local
    ServerAlias 127.0.0.1 localhost

    # 1. Melayani Static Files langsung via Apache (hasil collectstatic)
    Alias /static/ /var/www/administrasi-server/staticfiles/
    <Directory /var/www/administrasi-server/staticfiles>
        Require all granted
    </Directory>

    # 2. Melayani Media Files (upload gambar produk/portfolio)
    Alias /media/ /var/www/administrasi-server/media/
    <Directory /var/www/administrasi-server/media>
        Require all granted
    </Directory>

    # 3. WSGI Daemon Mode (Virtualenv & Django WSGI)
    WSGIDaemonProcess administrasi_server python-home=/var/www/administrasi-server/venv python-path=/var/www/administrasi-server
    WSGIProcessGroup administrasi_server
    WSGIScriptAlias / /var/www/administrasi-server/core/wsgi.py

    <Directory /var/www/administrasi-server/core>
        <Files wsgi.py>
            Require all granted
        </Files>
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/administrasi_error.log
    CustomLog ${APACHE_LOG_DIR}/administrasi_access.log combined
</VirtualHost>
